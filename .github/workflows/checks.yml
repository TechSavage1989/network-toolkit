name: Focused comparison origin diagnosis114
on:
  push:
    branches: ['investigate/toolkit114-divider']
permissions:
  contents: read
concurrency:
  group: focused-divider114-${{ github.ref }}
  cancel-in-progress: true
jobs:
  divider-origin:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: '24', package-manager-cache: false}
      - name: Prepare isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/divider114" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/divider114/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Observe native source gutter and gap origins after repeated resize
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/divider114/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/divider114-results
          TOOLKIT_DIVIDER_ONLY_MODE: modal
          TOOLKIT_DIVIDER_DIAGNOSTIC: '1'
        run: node scripts/editor-divider113.browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: divider-origin114
          path: ${{ runner.temp }}/divider114-results
          if-no-files-found: error
          retention-days: 7
