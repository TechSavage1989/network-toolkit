name: Focused Toolkit114 integration regressions
on:
  push:
    branches: ['investigate/toolkit114-regressions']
permissions:
  contents: read
concurrency:
  group: focused-regressions114-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with: {persist-credentials: false}
      - uses: actions/setup-node@v7
        with: {node-version: '24', package-manager-cache: false}
      - name: Prepare isolated browser
        run: |
          npm install --prefix "$RUNNER_TEMP/regression114" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/regression114/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exact-dataset graph startup and ten-second navigation
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/regression114/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/regression114-results/navigation114
        run: node scripts/graph-navigation114.browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-regressions114
          path: ${{ runner.temp }}/regression114-results
          if-no-files-found: error
          retention-days: 7
