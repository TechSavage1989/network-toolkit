name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-editor112:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated editor test browser
        run: |
          npm install --prefix "$RUNNER_TEMP/ntk-editor112" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/ntk-editor112/node_modules/playwright/cli.js" install chromium
      - name: Check persistent Files and Connections tabs and named drive buttons
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-editor112/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-editor112-results
        run: node scripts/editor-files115.browser.cjs
      - name: Check compact comparison options horizontal sync and difference symbols
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-editor112/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-editor112-results
        run: node scripts/editor-compare115.browser.cjs
      - name: Check editor pointer drag away reorder and cancelled moves
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-editor112/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-editor112-results
        run: node scripts/editor-drag115.browser.cjs
      - name: Check graph wheel inversion and data-aware hard zoom stops
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-editor112/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-editor112-results
        run: node scripts/graph-zoom115.browser.cjs
      - name: Retain focused115 visual evidence before existing regressions
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor115-focused-checks
          path: ${{ runner.temp }}/ntk-editor112-results
          if-no-files-found: error
          retention-days: 14
      - name: Exercise independent views and the full file sidebar
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-editor112/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-editor112-results
        run: node scripts/editor-views112.browser.cjs
      - name: Prepare exact published112 toolbar baseline
        if: success() || failure()
        run: |
          git fetch --no-tags --depth=1 origin 4d05f6a5a4eb1c315d0a19ccf2eb8daedf2dcb1c
          test "$(git rev-parse FETCH_HEAD)" = 4d05f6a5a4eb1c315d0a19ccf2eb8daedf2dcb1c
          mkdir -p "$RUNNER_TEMP/ntk-toolbar-baseline112"
          git archive 4d05f6a5a4eb1c315d0a19ccf2eb8daedf2dcb1c | tar -xf - -C "$RUNNER_TEMP/ntk-toolbar-baseline112"
      - name: Check compact113 toolbar and preserved editor operations
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-editor112/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-editor112-results
          NTK_TOOLBAR_BASELINE_DIR: ${{ runner.temp }}/ntk-toolbar-baseline112
        run: node scripts/editor-toolbar113.browser.cjs
      - name: Retain complete toolbar matrix before later UI checks
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor-toolbar113-early-checks
          path: ${{ runner.temp }}/ntk-editor112-results/editor-toolbar113-*
          if-no-files-found: error
          retention-days: 7
      - name: Check explicit saved connections and editor approval boundaries
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-editor112/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-editor112-results
        run: node scripts/editor-saved-connections113.browser.cjs
      - name: Check adjustable split and comparison dividers
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-editor112/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-editor112-results
        run: node scripts/editor-divider113.browser.cjs
      - name: Retain complete divider diagnostics before later UI checks
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor-divider113-early-checks
          path: ${{ runner.temp }}/ntk-editor112-results/editor-divider113-*
          if-no-files-found: error
          retention-days: 7
      - name: Check editable aligned comparison and source preservation
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-editor112/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-editor112-results
        run: node scripts/editor-alignment113.browser.cjs
      - name: Check loaded editor activity and guarded close preferences
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-editor112/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-editor112-results
        run: node scripts/editor-activity-close113.browser.cjs
      - name: Check continuous two-pane and map motion throughout all gestures
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-editor112/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-editor112-results/motion114
        run: node scripts/editor-motion114.browser.cjs
      - name: Check bounded16MiB normal and narrow editing search save undo and child transfer
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-editor112/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-editor112-results/capacity114
        run: node scripts/editor-capacity114.browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: editor112-browser-checks
          path: ${{ runner.temp }}/ntk-editor112-results
          if-no-files-found: error
          retention-days: 14

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate current release metadata
        run: python3 scripts/github_release.py validate
      - name: Test release publication guards
        run: python3 -m unittest discover -s scripts -p '*_test.py' -v
      - name: Test application and terminal lifecycle
        run: go test -mod=vendor ./cmd/network-toolkit ./internal/terminal ./internal/desktop ./internal/vaultcrypto ./internal/diag ./internal/deviceinfo ./internal/platform ./internal/capture
      - name: Test JavaScript behavior
        run: node --test scripts/*.test.cjs
      - name: Embed Windows icon and version resources
        run: python3 scripts/build_windows_resources.py
      - name: Build Windows x64 GUI application
        run: sh ./build.sh
      - name: Package review build
        if: startsWith(github.ref, 'refs/heads/review/hosts-editor-')
        run: |
          REVIEW_VERSION=$(node -p "require('./package.json').version")
          python3 scripts/github_release.py package --tag "v${REVIEW_VERSION}" --exe build/Network_Toolkit.exe
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/heads/review/hosts-editor-')
        with:
          name: Network-Toolkit-Hosts-Editor-Review
          path: dist/*_Portable.zip
          if-no-files-found: error
          retention-days: 30

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Reproduce and audit pinned offline comparison view
        run: |
          set -o pipefail
          cd scripts/vendor/codemirror
          npm ci --ignore-scripts --no-audit --no-fund --registry=https://registry.npmjs.org
          npm run verify 2>&1 | tee "$RUNNER_TEMP/network-toolkit-codemirror-rebuild.txt"
          npm audit --audit-level=low --json --registry=https://registry.npmjs.org > "$RUNNER_TEMP/network-toolkit-codemirror-audit-full.json"
          npm audit --omit=dev --audit-level=low --json --registry=https://registry.npmjs.org > "$RUNNER_TEMP/network-toolkit-codemirror-audit-runtime.json"
      - name: Verify pinned module checksums and vendored source
        run: |
          go mod download
          go mod verify
          go mod vendor -o "$RUNNER_TEMP/network-toolkit-canonical-vendor"
          diff -ru vendor "$RUNNER_TEMP/network-toolkit-canonical-vendor" > "$RUNNER_TEMP/network-toolkit-vendor-review.patch"
          git diff --exit-code -- go.mod go.sum
      - name: Install pinned Go vulnerability scanner
        if: success() || failure()
        run: GOBIN="$RUNNER_TEMP/network-toolkit-security-tools" go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Scan Linux source configuration
        if: success() || failure()
        env:
          GOFLAGS: -mod=vendor
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -o pipefail
          "$RUNNER_TEMP/network-toolkit-security-tools/govulncheck" -show verbose ./cmd/... ./internal/... 2>&1 | tee "$RUNNER_TEMP/network-toolkit-vuln-linux.txt"
      - name: Scan Windows source configuration
        if: success() || failure()
        env:
          GOFLAGS: -mod=vendor
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          set -o pipefail
          "$RUNNER_TEMP/network-toolkit-security-tools/govulncheck" -show verbose ./cmd/... ./internal/... 2>&1 | tee "$RUNNER_TEMP/network-toolkit-vuln-windows.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dependency-security-review
          path: |
            ${{ runner.temp }}/network-toolkit-vendor-review.patch
            ${{ runner.temp }}/network-toolkit-vuln-*.txt
            ${{ runner.temp }}/network-toolkit-codemirror-*
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: canonical-vendor-review
          path: ${{ runner.temp }}/network-toolkit-canonical-vendor
          if-no-files-found: ignore
          retention-days: 7

  windows-terminal:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test Windows terminal transports and local shells
        env:
          GOTOOLCHAIN: local
        run: go test -mod=vendor ./internal/terminal -run 'TestWindowsLocalShell|TestLocalShell' -count=1 -v
      - name: Test native credential protection and capability isolation
        env:
          GOTOOLCHAIN: local
        run: go test -mod=vendor ./cmd/network-toolkit -run 'TestWindowsCredential|TestCredential|TestVaultV2|TestPublicBootstrap|TestTerminalActivationRecord|TestEmbeddedUI|TestTerminalWindow|TestTerminalView' -count=1 -v
      - name: Test authenticated vault envelopes on Windows
        env:
          GOTOOLCHAIN: local
        run: go test -mod=vendor ./internal/vaultcrypto -count=1 -v
      - name: Verify real WebView2 private bootstrap
        env:
          GOTOOLCHAIN: local
          NETWORK_TOOLKIT_NATIVE_SECURITY_TEST: '1'
          TOOLKIT_NATIVE_TEST_OUTPUT: ${{ runner.temp }}/network-toolkit-native-dialogs
        run: go test -mod=vendor ./internal/desktop -run 'TestNativeBootstrap|TestCredentialConfirmation|TestVaultDialog' -count=1 -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-vault-dialog-checks
          path: ${{ runner.temp }}/network-toolkit-native-dialogs
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify capture navigation never requests administrator approval
        env:
          GOTOOLCHAIN: local
        run: go test -mod=vendor ./cmd/network-toolkit -run 'TestPacketCapturePrivilegeBoundaryNavigationAndExplicitCancel|TestPacketNative|TestColorPickerPreferencesSurviveStateAndNarrowTerminalDisplays' -count=1 -v
      - name: Test confined local and SFTP staged publication on Windows
        env:
          GOTOOLCHAIN: local
        run: |
          go test -mod=vendor ./cmd/network-toolkit -run 'TestExplorer|TestSFTPDropRename|TestRemoteBrowserPersistent|TestEditorCapacity114|TestLocalDriveNames115' -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -mod=vendor ./internal/diag -run TestSFTPStaged -count=1 -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -mod=vendor ./cmd/network-toolkit -run 'TestEditorExplorer|TestEditorLayout' -count=1 -v
      - name: Verify real Windows Explorer file drops into native WebView2
        env:
          GOTOOLCHAIN: local
          NETWORK_TOOLKIT_NATIVE_EXPLORER_TEST: '1'
          TOOLKIT_NATIVE_TEST_OUTPUT: ${{ runner.temp }}/network-toolkit-native107
        run: go test -mod=vendor ./internal/desktop -run TestNativeExplorerDropInstalledWebView2 -count=1 -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-explorer107-checks
          path: ${{ runner.temp }}/network-toolkit-native107
          if-no-files-found: error
          retention-days: 7
      - name: Verify native editor dirty-close consent and acknowledged two-window moves
        env:
          GOTOOLCHAIN: local
          NETWORK_TOOLKIT_NATIVE_EDITOR_TEST: '1'
          TOOLKIT_NATIVE_TEST_OUTPUT: ${{ runner.temp }}/network-toolkit-native-editor108
        run: |
          go test -mod=vendor ./internal/desktop -run '^TestNativeEditorClose(ApprovalInstalledWebView2|ScriptUsesExplicitAction)$' -count=1 -timeout=3m -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -mod=vendor ./cmd/network-toolkit -run '^TestNativeEditorTransferInstalledWebView2$' -count=1 -timeout=6m -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-editor108-checks
          path: ${{ runner.temp }}/network-toolkit-native-editor108
          if-no-files-found: error
          retention-days: 7
      - name: Verify actual Explorer files folders cancellation and junction confinement
        env:
          GOTOOLCHAIN: local
          NETWORK_TOOLKIT_NATIVE_EXPLORER_TEST: '1'
          TOOLKIT_NATIVE_TEST_OUTPUT: ${{ runner.temp }}/network-toolkit-native-files114
        run: go test -mod=vendor ./internal/desktop -run 'TestNativeExplorerFiles114|TestNativeFileDrag' -count=1 -timeout=6m -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-files114-checks
          path: ${{ runner.temp }}/network-toolkit-native-files114
          if-no-files-found: error
          retention-days: 7
      - name: Verify native Terminal names gestures bulk scope selection and transport
        env:
          GOTOOLCHAIN: local
          NETWORK_TOOLKIT_NATIVE_TERMINAL_TEST: '1'
          NETWORK_TOOLKIT_NATIVE_TERMINAL_GESTURES: '1'
          NETWORK_TOOLKIT_NATIVE_TERMINAL_SELECTION: '1'
          TOOLKIT_NATIVE_TIMING_LABEL: '114-final'
          TOOLKIT_NATIVE_TEST_OUTPUT: ${{ runner.temp }}/network-toolkit-native-transfer114/terminal
        run: go test -mod=vendor ./cmd/network-toolkit -run '^TestNativeTerminalTransferInstalledWebView2$' -count=1 -timeout=6m -v
      - name: Verify native4MiB editor handoff state and timings
        env:
          GOTOOLCHAIN: local
          NETWORK_TOOLKIT_NATIVE_EDITOR_TEST: '1'
          NETWORK_TOOLKIT_NATIVE_PERFORMANCE114: '1'
          NETWORK_TOOLKIT_NATIVE_PERFORMANCE_BYTES: '4194304'
          TOOLKIT_NATIVE_TEST_OUTPUT: ${{ runner.temp }}/network-toolkit-native-transfer114/editor
        run: go test -mod=vendor ./cmd/network-toolkit -run '^TestNativeEditorTransferInstalledWebView2$' -count=1 -timeout=6m -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-transfer114-checks
          path: ${{ runner.temp }}/network-toolkit-native-transfer114
          if-no-files-found: error
          retention-days: 7
      - name: Test visible Windows installer progress
        env:
          GOTOOLCHAIN: local
        run: go test -mod=vendor ./cmd/network-toolkit -run TestUpdateProgressWindowLifecycle -count=1 -v

      - name: Test native timestamp acquisition and packet statistics
        env:
          GOTOOLCHAIN: local
        run: go test -mod=vendor ./cmd/network-toolkit ./internal/platform ./internal/capture -run 'TestSnapshotRows|TestStatistics|TestLocalSnapshotTimes|TestUnavailableLocalSnapshots' -count=1 -v

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/ntk-browser-tests" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/ntk-browser-tests/node_modules/playwright/cli.js" install chromium
          # Hosted images normally provide Chromium's shared libraries. Avoid
          # downloading unrelated font/library upgrades from a slow apt mirror;
          # retain the full dependency installer when a browser cannot launch.
          if ! PLAYWRIGHT_MODULE="$RUNNER_TEMP/ntk-browser-tests/node_modules/playwright" node -e 'require(process.env.PLAYWRIGHT_MODULE).chromium.launch({headless:true}).then(browser=>browser.close()).catch(error=>{console.error(error.message);process.exitCode=1})'; then
            node "$RUNNER_TEMP/ntk-browser-tests/node_modules/playwright/cli.js" install --with-deps chromium
          fi
      - name: Check stable Local Network layout and automatic snapshots
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-89.browser.cjs
      - name: Check full-history Fit and proportional timeline navigators
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-98.browser.cjs
      - name: Check smooth graph compression, direct controls and visible-value scaling
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-97.browser.cjs
      - name: Check fitted graph tabs, shared following and responsive time axes
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-96.browser.cjs
      - name: Check condensed history, time navigation and held entry selections
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-95.browser.cjs
      - name: Check graph zoom, statistics filters and latest tracking
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-94.browser.cjs
      - name: Retain complete early graph acceptance evidence
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: graph-viewport107-checks
          path: ${{ runner.temp }}/ntk-browser-results/ui9[4-8]*
          if-no-files-found: ignore
          retention-days: 7
      - name: Check macro folders, local terminal UI, scan sizing, copy controls and update progress
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-83.browser.cjs
      - name: Check editor languages, local formatting and shell colors
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-84.browser.cjs
      - name: Check local shell colors, close preferences and collapsed tool navigation
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-85.browser.cjs
      - name: Check editor actions, in-app dialogs, wrapped syntax and shell output
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/editor-source-review.browser.cjs
      - name: Check remote picker columns, public IP placement and compact network layouts
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-88.browser.cjs
      - name: Check proportional headers, shared controls and sidebar toggles
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-90.browser.cjs
      - name: Check stationary navigation icons and full generated subnet list
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-91.browser.cjs
      - name: Check recorded local times and interactive result graphs
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-92.browser.cjs
      - name: Check persistent graph interactions, timestamp preferences and split results
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-93.browser.cjs
      - name: Check application layout and consistent copy controls
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/ui-consistency.browser.cjs
      - uses: actions/setup-go@v7
        if: success() || failure()
        with:
          go-version-file: go.mod
          cache: false
      - name: Check real diagnostic copy actions and clipboard
        if: success() || failure()
        env:
          GOTOOLCHAIN: local
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          NTK_APP_EXECUTABLE: ${{ runner.temp }}/Network_Toolkit_UI_Test
          NTK_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/ntk-browser-results
        run: |
          CGO_ENABLED=0 go build -mod=vendor -o "$NTK_APP_EXECUTABLE" ./cmd/network-toolkit
          node scripts/value-copy-live.cjs
      - name: Check terminal selection deletion with trailing empty cells
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          NTK_APP_EXECUTABLE: ${{ runner.temp }}/Network_Toolkit_UI_Test
          NTK_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/terminal-selection-live.cjs
      - name: Check Hosts editor interactions and responsive layouts
        if: success() || failure()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
