name: Checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate current release metadata
        run: python3 scripts/github_release.py validate
      - name: Test release publication guards
        run: python3 -m unittest discover -s scripts -p '*_test.py' -v
      - name: Test application and terminal lifecycle
        run: go test -mod=vendor . ./internal/terminal ./internal/desktop ./internal/diag ./internal/deviceinfo
      - name: Test JavaScript behavior
        run: node --test scripts/*.test.cjs
      - name: Embed Windows icon and version resources
        run: python3 scripts/build_windows_resources.py
      - name: Build Windows x64 GUI application
        run: sh ./build.sh
      - name: Package review build
        if: startsWith(github.ref, 'refs/heads/review/hosts-editor-')
        run: |
          REVIEW_VERSION=$(node -p "require('./package.json').version")
          python3 scripts/github_release.py package --tag "v${REVIEW_VERSION}" --exe build/Network_Toolkit.exe
      - uses: actions/upload-artifact@v7
        if: startsWith(github.ref, 'refs/heads/review/hosts-editor-')
        with:
          name: Network-Toolkit-Hosts-Editor-Review
          path: dist/*_Portable.zip
          if-no-files-found: error
          retention-days: 30

  windows-terminal:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Test Windows terminal transports and local shells
        env:
          GOTOOLCHAIN: local
        run: go test -mod=vendor ./internal/terminal -run 'TestWindowsLocalShell|TestLocalShell' -count=1 -v
      - name: Test visible Windows installer progress
        env:
          GOTOOLCHAIN: local
        run: go test -mod=vendor . -run TestUpdateProgressWindowLifecycle -count=1 -v

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/ntk-browser-tests" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/ntk-browser-tests/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check macro folders, local terminal UI, scan sizing, copy controls and update progress
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-83.browser.cjs
      - name: Check editor languages, local formatting and shell colors
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/features-84.browser.cjs
      - name: Check application layout and consistent copy controls
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/ui-consistency.browser.cjs
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Check real diagnostic copy actions and clipboard
        env:
          GOTOOLCHAIN: local
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          NTK_APP_EXECUTABLE: ${{ runner.temp }}/Network_Toolkit_UI_Test
          NTK_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/ntk-browser-results
        run: |
          CGO_ENABLED=0 go build -mod=vendor -o "$NTK_APP_EXECUTABLE" .
          node scripts/value-copy-live.cjs
      - name: Check terminal selection deletion with trailing empty cells
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          NTK_APP_EXECUTABLE: ${{ runner.temp }}/Network_Toolkit_UI_Test
          NTK_BROWSER_OUTPUT_DIR: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/terminal-selection-live.cjs
      - name: Check Hosts editor interactions and responsive layouts
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/hosts-editor.browser.cjs
      - name: Check server selectors, saved addresses and responsive layouts
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/transfer-server-layout.browser.cjs
      - name: Check client connection controls and activity layout
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
        run: node scripts/transfer-client-layout.browser.cjs
      - name: Check SMTP password retention and navigation clearing
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
        run: node scripts/smtp-password.browser.cjs
      - name: Check saved session folders and persistence
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/saved-session-folders.browser.cjs
      - name: Check terminal command input without scrollbar tracks
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/terminal-commandbar.browser.cjs
      - name: Check restored terminal connection dialog and sidebar
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/terminal-connection-dialog.browser.cjs
      - name: Check files open at the start in the text editor
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/file-editor-start.browser.cjs
      - name: Check automatic update startup and release notes
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/app-updater-startup.browser.cjs
      - name: Check native Chromium update timers and released regression control
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-browser-tests/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-browser-results
        run: node scripts/app-updater-native-timers.browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: transfer-browser-checks
          path: ${{ runner.temp }}/ntk-browser-results
          if-no-files-found: ignore
          retention-days: 7

