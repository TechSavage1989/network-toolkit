name: Prepare 1.21.20 editor release resources
on:
  push:
    branches: ['fix/1.21.20-large-editor-comparison-performance']
permissions:
  contents: write
concurrency:
  group: prepare-editor-12120
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check large editor and comparison behavior
        run: |
          node --test scripts/editor-large-index.test.cjs scripts/editor-large-worker.test.cjs scripts/editor-compare.test.cjs
      - name: Generate validated Windows version resources
        run: |
          python3 scripts/build_windows_resources.py
          python3 scripts/github_release.py validate --tag v1.21.20
          python3 -m unittest discover -s scripts -p 'icon_assets_test.py'
      - name: Commit version resources only on candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cmd/network-toolkit/resource_windows_amd64.syso
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate Windows version resources for v1.21.20"
            git push origin HEAD:fix/1.21.20-large-editor-comparison-performance
          fi
