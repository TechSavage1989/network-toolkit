name: Temporary graph validation browser tools
on: [push]
permissions:
  contents: read
jobs:
  browser-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: |
          npm install --prefix "$RUNNER_TEMP/graph-tools" --no-audit --no-fund playwright@1.62.1
          PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/graph-browsers" node "$RUNNER_TEMP/graph-tools/node_modules/playwright/cli.js" install chromium
      - uses: actions/upload-artifact@v7
        with:
          name: graph-browser-tools-96
          path: ${{ runner.temp }}/graph-browsers
          include-hidden-files: true
          retention-days: 2
