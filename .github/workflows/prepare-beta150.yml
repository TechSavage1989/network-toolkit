name: Prepare Beta 14 Windows resources

on:
  push:
    branches: ['beta/1.17.150-sftp-completion-safety']
    paths:
      - '.github/workflows/prepare-beta150.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Generate standard embedded Windows resources from source
        run: python3 scripts/build_windows_resources.py
      - name: Commit generated binary resource to this candidate branch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' internal/model/model.go)" = '1.17.150'
          git add cmd/network-toolkit/resource_windows_amd64.syso
          if git diff --cached --quiet; then
            echo "Resource file did not change. Checking generated version."
            python3 scripts/github_release.py validate
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate Windows version 1.17.150 resource at build time'
          git push origin HEAD:refs/heads/beta/1.17.150-sftp-completion-safety
