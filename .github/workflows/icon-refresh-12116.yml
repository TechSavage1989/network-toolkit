name: Prepare Beta 17 flat icon assets
on:
  push:
    branches: ['icon/1.21.16-flat-cli-network']
permissions:
  contents: write
concurrency:
  group: icon-12116-assets
  cancel-in-progress: false
jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install the secure vector renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends inkscape
      - name: Generate editable-source derived icon and native resources
        run: |
          python3 scripts/generate_icon_assets.py
          python3 scripts/build_windows_resources.py
          python3 scripts/generate_icon_assets.py --check
          python3 scripts/github_release.py validate --tag v1.21.16
          python3 -m unittest discover -s scripts -p icon_assets_test.py -v
      - name: Commit generated assets on the candidate branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Network_Toolkit_Icon.svg assets/Network_Toolkit_Icon.png assets/Network_Toolkit_Icon.ico assets/Network_Toolkit_Icon.manifest.json cmd/network-toolkit/resource_windows_amd64.syso
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate flat icon SVG PNG ICO manifest and Windows resources"
            git push origin HEAD:icon/1.21.16-flat-cli-network
          fi
