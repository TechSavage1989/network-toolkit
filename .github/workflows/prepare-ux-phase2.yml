name: Prepare UX Phase 2 Windows resources

on:
  push:
    branches: ['beta/1.18.0-phase2-visual-foundations']
    paths:
      - '.github/workflows/prepare-ux-phase2.yml'

permissions:
  contents: write

jobs:
  resource:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Generate Windows resource from source
        run: python3 scripts/build_windows_resources.py
      - name: Commit the generated version resource
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^const Version = "\([^"]*\)"/\1/p' internal/model/model.go)" = "1.18.1"
          git add cmd/network-toolkit/resource_windows_amd64.syso
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            python3 scripts/github_release.py validate
            exit 0
          fi
          git commit -m 'Generate Phase 2 Windows executable version resource'
          git push origin HEAD:refs/heads/beta/1.18.0-phase2-visual-foundations
