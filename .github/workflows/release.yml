name: Release

on:
  push:
    branches: [main, release-revision-v1.17.63]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to publish, for example v1.17.57'
        required: true
        type: string
      revise_existing:
        description: 'Explicitly authorized same-version asset replacement and tag move; durable original backup required'
        type: boolean
        default: false
      expected_old_commit:
        description: 'Full original tag commit SHA, required for revision'
        type: string
      expected_new_commit:
        description: 'Exact revised source commit SHA, required for revision'
        type: string
      expected_old_manifest:
        description: 'Original SHA256SUMS file SHA-256, required for revision'
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      revision: ${{ steps.release.outputs.revision }}
      old_commit: ${{ steps.release.outputs.old_commit }}
      old_manifest: ${{ steps.release.outputs.old_manifest }}
      new_commit: ${{ steps.release.outputs.new_commit }}
      request_commit: ${{ steps.release.outputs.request_commit }}
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test release publication guards
        run: python3 -m unittest discover -s scripts -p '*_test.py' -v
      - name: Select and validate the exact release tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REVISE_EXISTING: ${{ inputs.revise_existing || 'false' }}
          EXPECTED_OLD_COMMIT: ${{ inputs.expected_old_commit }}
          EXPECTED_OLD_MANIFEST: ${{ inputs.expected_old_manifest }}
          EXPECTED_NEW_COMMIT: ${{ inputs.expected_new_commit }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/release-revision-v1.17.63" ]; then
            python3 scripts/github_release.py prepare --default-branch "$DEFAULT_BRANCH" --revision-request .github/revision-request.json
          elif [ "$REVISE_EXISTING" = "true" ]; then
            python3 scripts/github_release.py prepare --tag "$RELEASE_TAG" --default-branch "$DEFAULT_BRANCH" --revision --expected-old-commit "$EXPECTED_OLD_COMMIT" --expected-old-manifest "$EXPECTED_OLD_MANIFEST" --expected-new-commit "$EXPECTED_NEW_COMMIT"
          else
            python3 scripts/github_release.py prepare --tag "$RELEASE_TAG" --default-branch "$DEFAULT_BRANCH"
          fi
      - uses: actions/setup-go@v7
        if: steps.release.outputs.publish == 'true'
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v7
        if: steps.release.outputs.publish == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test application and terminal lifecycle
        if: steps.release.outputs.publish == 'true'
        run: go test -mod=vendor . ./internal/terminal ./internal/desktop
      - name: Test JavaScript behavior
        if: steps.release.outputs.publish == 'true'
        run: node --test scripts/*.test.cjs
      - name: Embed Windows icon and version resources
        if: steps.release.outputs.publish == 'true'
        run: python3 scripts/build_windows_resources.py
      - name: Build Windows x64 GUI application
        if: steps.release.outputs.publish == 'true'
        run: sh ./build.sh
      - name: Package and verify portable source and binary-only updater assets
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: python3 scripts/github_release.py package --tag "$RELEASE_TAG" --exe "build/Network_Toolkit.exe"
      - uses: actions/upload-artifact@v7
        if: steps.release.outputs.publish == 'true'
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist
      - name: Back up and verify the explicitly selected original release
        if: needs.build.outputs.revision == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          EXPECTED_OLD_COMMIT: ${{ needs.build.outputs.old_commit }}
          EXPECTED_OLD_MANIFEST: ${{ needs.build.outputs.old_manifest }}
          EXPECTED_NEW_COMMIT: ${{ needs.build.outputs.new_commit }}
          EXPECTED_REQUEST_COMMIT: ${{ needs.build.outputs.request_commit }}
        run: python3 scripts/revise_release.py backup --tag "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --expected-old-commit "$EXPECTED_OLD_COMMIT" --expected-old-manifest "$EXPECTED_OLD_MANIFEST" --expected-new-commit "$EXPECTED_NEW_COMMIT"
      - uses: actions/upload-artifact@v7
        if: needs.build.outputs.revision == 'true'
        with:
          name: original-release-before-revision
          path: previous-release/*
          if-no-files-found: error
          retention-days: 90
      - name: Publish explicitly authorized same-version revision
        if: needs.build.outputs.revision == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          EXPECTED_OLD_COMMIT: ${{ needs.build.outputs.old_commit }}
          EXPECTED_OLD_MANIFEST: ${{ needs.build.outputs.old_manifest }}
          EXPECTED_NEW_COMMIT: ${{ needs.build.outputs.new_commit }}
          EXPECTED_REQUEST_COMMIT: ${{ needs.build.outputs.request_commit }}
        run: python3 scripts/revise_release.py publish --tag "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY" --expected-old-commit "$EXPECTED_OLD_COMMIT" --expected-old-manifest "$EXPECTED_OLD_MANIFEST" --expected-new-commit "$EXPECTED_NEW_COMMIT" --expected-request-commit "$EXPECTED_REQUEST_COMMIT"
      - name: Verify and publish a new release without overwriting an existing release
        if: needs.build.outputs.revision != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/github_release.py publish --tag "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY"
