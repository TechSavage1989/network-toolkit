name: Phase 5 UX welcome and guidance
on:
  push:
    branches: ['beta/1.18.4-ux-phase5']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  phase5-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/ntk-phase5" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/ntk-phase5/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Check welcome, saved preferences, empty states and error guidance
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-phase5/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-phase5-results
        run: node scripts/ux-phase5.browser.cjs
      - name: Retest updater behavior with welcome and guidance
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-phase5/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-phase5-results/updater
        run: node scripts/app-updater-startup.browser.cjs
      - name: Retest native updater timers and explicit consent
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-phase5/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-phase5-results/updater-native
        run: node scripts/app-updater-native-timers.browser.cjs
      - name: Save Phase 5 screenshot and test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase5-ux-evidence
          path: ${{ runner.temp }}/ntk-phase5-results
          if-no-files-found: error
          retention-days: 30
