name: Phase 4 settings and tab recovery acceptance

on:
  push:
    branches: ['beta/1.18.3-phase4-settings-tabs']
    paths:
      - 'web/index.html'
      - 'web/assets/ux-unified-settings.*'
      - 'web/assets/ux-tab-recovery.js'
      - 'web/assets/file-editor.js'
      - 'web/assets/terminal-tabs.js'
      - 'scripts/ux-phase4.browser.cjs'
      - '.github/workflows/ux-phase4.yml'

permissions:
  contents: read

jobs:
  phase4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install isolated Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/ntk-phase4" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/ntk-phase4/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Exercise searchable settings, saved preferences and tab recovery
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-phase4/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-phase4-results
        run: node scripts/ux-phase4.browser.cjs
      - name: Capture all tools at 1280x800 and 1920x1080 in light and dark
        if: success()
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/ntk-phase4/node_modules/playwright
          TOOLKIT_TEST_OUTPUT: ${{ runner.temp }}/ntk-phase4-screenshots
        run: node scripts/ux-audit-screenshots.browser.cjs
      - name: Preserve Phase 4 behavioral and screenshot evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase4-settings-tab-recovery
          path: |
            ${{ runner.temp }}/ntk-phase4-results
            ${{ runner.temp }}/ntk-phase4-screenshots
          if-no-files-found: warn
          retention-days: 30
